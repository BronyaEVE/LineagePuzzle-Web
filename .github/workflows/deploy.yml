# 构建 frontend 并部署到 GitHub Pages。
# push 到 main 自动触发：npm run build → 上传 dist → 发布到 Pages。
#
# 访问地址：https://bronyaeve.github.io/LineagePuzzle-Web/
#
# 首次使用还需在仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 支持手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:

# 允许 Pages 部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署（避免并发覆盖）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
